<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FOOD MART – Badarpur home delivery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#1b2a41;--mut:#6b7385;--line:#e6e2d6;--y:#f2b705;--r:#c63d26;--g:#23744a;--hd:#1b2a41;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101722;--card:#1a2536;--ink:#f1eee4;--mut:#9aa3b5;--line:#2c374b;--hd:#0b111a;--g:#5fc58c;--r:#ff7b62}}
:root[data-theme="dark"]{--bg:#101722;--card:#1a2536;--ink:#f1eee4;--mut:#9aa3b5;--line:#2c374b;--hd:#0b111a;--g:#5fc58c;--r:#ff7b62}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:#fff}
.bar{max-width:1100px;margin:auto;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:28px;letter-spacing:.5px;color:var(--y);line-height:1}.logo small{display:block;font-size:11px;font-weight:400;color:#fff;opacity:.8;letter-spacing:0}
#q{flex:1;min-width:150px;padding:10px 16px;border-radius:999px;border:0;font:inherit;background:#fff;color:#1b2a41}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:none;border:0;color:#fff;font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}nav button.on{background:rgba(255,255,255,.18)}
.awn{height:12px;background:repeating-linear-gradient(90deg,var(--y) 0 26px,#fff 26px 52px)}
main{max-width:1100px;margin:auto;padding:16px 14px 80px}
h2{font-size:26px;margin:.3em 0}h3{margin:1.2em 0 .4em}.mut{color:var(--mut)}small{font-size:13px}
.hero{font-size:18px;margin:4px 0 12px}.hero b{color:var(--r)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.ic{position:relative;height:96px;display:grid;place-items:center;font-size:40px}.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card);border-radius:8px}.nm{font-weight:600;line-height:1.25;flex:1;overflow-wrap:anywhere}.pr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.pr s{color:var(--mut);font-size:13px}.off{background:var(--g);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.btn{background:var(--y);color:#1b2a41;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.big{width:100%;padding:14px;font-size:17px}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:none;color:var(--r);border:1px solid var(--r)}
.step{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px}.step button{border:0;background:none;color:var(--ink);font:inherit;font-size:20px;width:36px;height:34px;cursor:pointer}.step span{min-width:18px;text-align:center;font-weight:600}
.lst,.sum,.frm,.oc{max-width:640px}.row{display:grid;grid-template-columns:1fr auto 80px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row b{text-align:right}
.sum{margin:14px 0;display:grid;gap:4px}.sum div{display:flex;justify-content:space-between}.tt{font-size:20px;border-top:2px solid var(--ink);padding-top:6px}
.frm{display:grid;gap:12px}label{display:grid;gap:4px;font-weight:600}.ck{display:flex;gap:8px;align-items:center;font-weight:400}
input,textarea,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}.ck input{width:auto}
.msg{color:var(--r);min-height:1.4em;margin:0}.ok{color:var(--g)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}.oh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--y);color:#1b2a41}.pill.Delivered{background:var(--g);color:#fff}.pill.Cancelled{background:var(--r);color:#fff}
.it{font-size:14px;color:var(--mut);margin:6px 0}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}.stats b{display:block;font-size:24px}
.note{background:var(--card);border-left:4px solid var(--y);padding:10px 14px;border-radius:8px;max-width:640px}
.oc.wide{max-width:900px}
</style></head><body>
<header><div class="bar"><div class="logo">FOOD MART<small>Home delivery · Badarpur</small></div><input id="q" type="search" placeholder="Search name or barcode" aria-label="Search items">
<nav><button data-v="shop">Shop</button><button data-v="cart">Basket <span id="cn"></span></button><button data-v="orders">My orders</button><button data-v="acc">Account</button><button data-v="admin" id="adm" hidden>Admin</button></nav></div><div class="awn"></div></header>
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="products.js"></script>
<script>
const CAT=window.CATALOG,P=CAT.p,CATS=CAT.cats;
const ICON={'Dairy & Eggs':'🥛','Baby Care':'🍼','Staples & Grains':'🌾','Spices & Masala':'🌶️','Biscuits & Chocolates':'🍪','Snacks & Namkeen':'🥨','Beverages':'🥤','Household & Cleaning':'🧴','Personal Care':'🧼','Stationery':'✏️','Packaged Foods':'🥫','Health & Wellness':'💊','Other Essentials':'🛒'};
const FREE=999,FEE=30,MIN=100,PAGE=60,ST=['New','Confirmed','Packed','Out for delivery','Delivered','Cancelled'],NEXT={New:'Confirmed',Confirmed:'Packed',Packed:'Out for delivery','Out for delivery':'Delivered'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN'),when=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const IMG=SUPABASE_URL+'/storage/v1/object/public/photos/';
const byId=new Map(P.map(p=>[p[0],p]));
let S={view:'shop',cat:'All',q:'',page:1,cart:{},f:{},db:null,uid:null,admin:false,pub:null,cfg:false,vault:null,vpw:null,priv:null,orders:[],mine:[],stat:{},dec:{},filt:'Active'};
try{S.cart=JSON.parse(localStorage.getItem('fm_cart')||'{}')}catch(e){}
/* ---- encryption helpers (WebCrypto, all in the browser) ---- */
const B=a=>btoa(String.fromCharCode(...new Uint8Array(a))),U=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),TE=new TextEncoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function kdf(pw,salt){const m=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(pw,o){const s=rnd(16),i=rnd(12),c=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await kdf(pw,s),TE.encode(JSON.stringify(o)));return{s:B(s),i:B(i),c:B(c)}}
async function open(pw,e){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:U(e.i)},await kdf(pw,U(e.s)),U(e.c))))}
async function sealFor(pub,o){const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),i=rnd(12),c=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},k,TE.encode(JSON.stringify(o))),pk=await crypto.subtle.importKey('jwk',pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']),w=await crypto.subtle.encrypt({name:'RSA-OAEP'},pk,await crypto.subtle.exportKey('raw',k));return{w:B(w),i:B(i),c:B(c)}}
async function openWith(prv,e){const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},prv,U(e.w)),k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:U(e.i)},k,U(e.c))))}
/* ---- shop ---- */
const list=()=>{const q=S.q.toLowerCase().trim();return P.filter(p=>(S.cat==='All'||p[2]===S.cat)&&(!q||p[1].toLowerCase().includes(q)||p[7].includes(q)))};
const lines=()=>Object.entries(S.cart).map(([id,q])=>{const p=byId.get(+id);return p&&[p,q]}).filter(Boolean);
const tot=()=>{const sub=lines().reduce((a,[p,q])=>a+p[3]*q,0),fee=sub&&sub<FREE?FEE:0;return{sub,fee,total:sub+fee}};
const stOf=id=>S.stat[id]?.st||'New';
function chg(id,d){const p=byId.get(id),n=Math.max(0,Math.min(p[6],(S.cart[id]||0)+d));n?S.cart[id]=n:delete S.cart[id];try{localStorage.setItem('fm_cart',JSON.stringify(S.cart))}catch(e){}render()}
const stepper=(p,q)=>`<span class="step"><button data-d="-1" data-id="${p[0]}" aria-label="Remove one">−</button><span>${q}</span><button data-d="1" data-id="${p[0]}" aria-label="Add one">+</button></span>`;
function card(p){const q=S.cart[p[0]]||0,off=p[4]>p[3]?Math.round((1-p[3]/p[4])*100):0;return `<div class="card"><div class="ic">${p[7]?`<img loading="lazy" alt="" src="${IMG}${p[7]}.jpg" onerror="this.remove()">`:''}${ICON[p[2]]}</div><div class="nm">${esc(p[1])}</div><div class="mut">per ${p[5]}</div><div class="pr"><b>${inr(p[3])}</b>${off?`<s>${inr(p[4])}</s><span class="off">${off}% off</span>`:''}</div>${q?stepper(p,q):`<button class="btn" data-d="1" data-id="${p[0]}">Add</button>`}</div>`}
function shopV(){const L=list(),sh=L.slice(0,S.page*PAGE);return `<p class="hero">Fresh from the shelf to your door in <b>Badarpur</b>. Free delivery over ${inr(FREE)}.</p><div class="chips">${['All',...CATS].map(c=>`<button class="chip ${c===S.cat?'on':''}" data-cat="${esc(c)}">${ICON[c]||''} ${esc(c)}</button>`).join('')}</div><p class="mut">${L.length.toLocaleString('en-IN')} items</p><div class="grid">${sh.map(card).join('')||'<p>Nothing matches that search. Try a shorter word.</p>'}</div>${sh.length<L.length?'<p><button class="btn alt" id="more">Show more</button></p>':''}`}
function cartV(){const L=lines(),t=tot(),v=S.vault||{addrs:[]},f=(k,d='')=>esc(S.f[k]??d);
if(!L.length)return `<h2>Your basket is empty</h2><p>Add a few things from the shop.</p><button class="btn" data-v="shop">Browse items</button>`;
return `<h2>Your basket</h2><div class="lst">${L.map(([p,q])=>`<div class="row"><span>${esc(p[1])}<br><small class="mut">${inr(p[3])} each</small></span>${stepper(p,q)}<b>${inr(p[3]*q)}</b></div>`).join('')}</div>
<div class="sum"><div>Items <b>${inr(t.sub)}</b></div><div>Delivery <b>${t.fee?inr(t.fee):'Free'}</b></div><div class="tt">Total <b>${inr(t.total)}</b></div>${t.sub<FREE?`<small class="mut">Add ${inr(FREE-t.sub)} more for free delivery</small>`:''}</div>
<h3>Delivery details</h3><div class="frm">${v.addrs.length?`<label>Saved address<select id="sa"><option value="">Enter a new address</option>${v.addrs.map((a,i)=>`<option value="${i}">${esc(a.line)}</option>`).join('')}</select></label>`:''}
<label>Name<input id="nm" autocomplete="name" value="${f('nm',v.name)}"></label><label>Mobile number<input id="ph" inputmode="numeric" maxlength="10" autocomplete="tel" value="${f('ph',v.phone)}"></label>
<label>House, street and locality in Badarpur<textarea id="ad" rows="2">${f('ad')}</textarea></label><label>Landmark (optional)<input id="lm" value="${f('lm')}"></label>
<label class="ck"><input type="checkbox" id="sv" ${S.vpw?'checked':'disabled'}> ${S.vpw?'Save these details to my encrypted vault':'Unlock your vault in Account to save these details'}</label>
<p class="mut">Pay cash or UPI when the order arrives. Minimum order ${inr(MIN)}.</p><button class="btn big" id="place" ${S.db&&S.pub?'':'disabled'}>Place order · ${inr(t.total)}</button><p id="msg" class="msg">${S.db?(S.pub?'':'The store is not taking orders yet.'):'The shop is not connected to its database yet.'}</p></div>`}
const say=x=>{const e=$('#msg');if(e){e.className='msg';e.textContent=x}};
async function place(){const t=tot(),nm=$('#nm').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim(),lm=$('#lm').value.trim(),sv=$('#sv').checked;
if(t.sub<MIN)return say(`Minimum order is ${inr(MIN)}.`);
if(!nm||!/^[6-9]\d{9}$/.test(ph)||ad.length<5)return say('Enter your name, a 10-digit mobile number and your address.');
$('#place').disabled=true;say('Encrypting and sending your order…');
try{if(!S.uid){const{data,error}=await sb.auth.signInAnonymously();if(error)throw error;await onUser(data.user)}
const id='FM-'+Date.now().toString(36).toUpperCase(),pii=await sealFor(S.pub,{nm,ph,ad,lm});
const{error}=await sb.from('orders').insert({id,ts:Date.now(),uid:S.uid,items:lines().map(([p,q])=>[p[1],p[3],q]),sub:t.sub,fee:t.fee,total:t.total,pii,status:'New'});if(error)throw error;
if(sv&&S.vpw){const v=S.vault||{name:'',phone:'',addrs:[]};v.name=nm;v.phone=ph;if(!v.addrs.some(a=>a.line===ad))v.addrs.push({line:ad,lm});S.vault=v;await saveVault()}
S.cart={};S.f={};try{localStorage.removeItem('fm_cart')}catch(e){}S.view='orders';S.flash=id;await refresh();render()}
catch(e){say('Could not place the order. Check your connection and try again.');const b=$('#place');if(b)b.disabled=false}}
function ordersV(){const o=S.mine;return `<h2>My orders</h2>${S.flash?`<p class="note ok">Order ${esc(S.flash)} placed. We will call you to confirm.</p>`:''}${!S.db?'<p>Sign in to see your orders.</p>':o.length?o.map(x=>`<div class="oc"><div class="oh"><b>${esc(x.id)}</b><span class="pill ${stOf(x.id).replace(/ /g,'')}">${stOf(x.id)}</span></div><small class="mut">${when(x.ts)}</small><div class="it">${x.items.map(i=>`${esc(i[0])} × ${i[2]}`).join('<br>')}</div><b>${inr(x.total)}</b></div>`).join(''):'<p>No orders yet. Your first one will show up here.</p>'}`}
/* ---- accounts + customer vault ---- */
const saveVault=async()=>{const{error}=await sb.from('vaults').upsert({uid:S.uid,enc:await seal(S.vpw,S.vault)});if(error)throw error};
async function unlockVault(){const p=$('#vp').value,m=$('#vm');if(p.length<8)return m.textContent='Use at least 8 characters.';m.textContent='Unlocking…';
try{const{data}=await sb.from('vaults').select('enc').eq('uid',S.uid).maybeSingle();S.vault=data?await open(p,data.enc):{name:'',phone:'',addrs:[]};S.vpw=p;render()}catch(e){m.textContent='Could not unlock. Check your passphrase.'}}
async function authGo(up){const email=$('#em').value.trim(),password=$('#pw').value,m=$('#vm');if(!email||password.length<6)return m.textContent='Enter your email and a password of 6+ characters.';m.textContent='Please wait…';
const{error}=await(up?sb.auth.signUp({email,password}):sb.auth.signInWithPassword({email,password}));if(error)m.textContent=error.message}
function accV(){if(!S.uid||S.anon)return `<h2>Account</h2><div class="frm"><p class="note">Sign in to keep your name and addresses in a private encrypted vault. You can also order without an account.</p><label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><button class="btn" id="li">Sign in</button><button class="btn alt" id="sg">Create account</button><p id="vm" class="msg"></p></div>`;
if(!S.vpw)return `<h2>Your private vault</h2><div class="frm"><p class="note">Your name, mobile number and addresses are encrypted on this device with a passphrase only you know, then saved. Nobody at Food Mart can read them, and a lost passphrase cannot be recovered.</p><label>Vault passphrase (8+ characters)<input id="vp" type="password"></label><button class="btn" id="vu">Unlock or create vault</button><button class="btn alt" id="so">Sign out</button><p id="vm" class="msg"></p></div>`;
const v=S.vault;return `<h2>Your private vault</h2><div class="frm"><label>Name<input id="vn" value="${esc(v.name)}"></label><label>Mobile number<input id="vph" inputmode="numeric" maxlength="10" value="${esc(v.phone)}"></label><h3>Saved addresses</h3>${v.addrs.map((a,i)=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(a.line)}${a.lm?`<br><small class="mut">Near ${esc(a.lm)}</small>`:''}</span><button class="btn bad" data-rm="${i}">Remove</button></div>`).join('')||'<p class="mut">No addresses yet.</p>'}
<label>Add an address in Badarpur<textarea id="na" rows="2"></textarea></label><label>Landmark (optional)<input id="nl"></label><button class="btn" id="vs">Save to vault</button><button class="btn alt" id="vl">Lock vault</button><button class="btn alt" id="so">Sign out</button><p id="vm" class="msg"></p></div>`}
async function vaultSave(){const v=S.vault,m=$('#vm');v.name=$('#vn').value.trim();v.phone=$('#vph').value.trim();const a=$('#na').value.trim();if(a)v.addrs.push({line:a,lm:$('#nl').value.trim()});
try{await saveVault();if(a)render();const e=$('#vm');e.className='msg ok';e.textContent='Saved and encrypted.'}catch(e){m.textContent='Could not save. Try again.'}}
/* ---- admin ---- */
async function decAll(){if(!S.priv)return;let n=0;for(const o of S.orders)if(!S.dec[o.id]){try{S.dec[o.id]=await openWith(S.priv,o.pii);n++}catch(e){S.dec[o.id]={nm:'(cannot decrypt)',ph:'',ad:'',lm:''}}}if(n)soft()}
async function setup(){const p=$('#ap').value,m=$('#am');if(p.length<10)return m.textContent='Use a passphrase of at least 10 characters.';m.textContent='Creating keys…';
try{const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']),pub=await crypto.subtle.exportKey('jwk',kp.publicKey),prv=await crypto.subtle.exportKey('jwk',kp.privateKey);
let r=await sb.from('admin_keys').insert({id:1,enc:await seal(p,prv)});if(r.error)throw r.error;r=await sb.from('store_public').insert({id:1,pub});if(r.error)throw r.error;S.pub=pub;S.priv=kp.privateKey;decAll();render()}catch(e){m.textContent='Setup failed. Only an admin account can do this.'}}
async function unlock(){const m=$('#am');m.textContent='Unlocking…';try{const{data,error}=await sb.from('admin_keys').select('enc').eq('id',1).single();if(error)throw error;const jwk=await open($('#ap').value,data.enc);S.priv=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);decAll();render()}catch(e){m.textContent='Wrong passphrase.'}}
function adminV(){if(!S.admin)return `<h2>Admin</h2><p>This area is for store staff.</p>`;if(!S.db)return `<p>Admin needs a signed-in session.</p>`;
if(!S.cfg)return `<p>Loading…</p>`;
if(!S.pub)return `<h2>Set up order encryption</h2><div class="frm"><p class="note">Customer names, phone numbers and addresses are locked with a key that only this passphrase can open. Choose it carefully. If you lose it, existing order details cannot be recovered.</p><label>Admin passphrase (10+ characters)<input id="ap" type="password"></label><button class="btn" id="su">Create keys</button><p id="am" class="msg"></p></div>`;
if(!S.priv)return `<h2>Unlock admin</h2><div class="frm"><label>Admin passphrase<input id="ap" type="password"></label><button class="btn" id="un">Unlock orders</button><p id="am" class="msg"></p></div>`;
const O=S.orders,act=o=>!['Delivered','Cancelled'].includes(stOf(o.id)),day=new Date().setHours(0,0,0,0),rev=O.filter(o=>o.ts>=day&&stOf(o.id)!=='Cancelled').reduce((a,o)=>a+o.total,0);
const F=['Active',...ST,'All'],V=O.filter(o=>S.filt==='All'||(S.filt==='Active'?act(o):stOf(o.id)===S.filt));
return `<h2>Orders</h2><div class="stats"><div><b>${O.filter(o=>stOf(o.id)==='New').length}</b>New</div><div><b>${O.filter(act).length}</b>To deliver</div><div><b>${inr(rev)}</b>Today's sales</div></div><div class="chips">${F.map(f=>`<button class="chip ${f===S.filt?'on':''}" data-f="${f}">${f}</button>`).join('')}</div><p></p>
${V.map(o=>{const d=S.dec[o.id]||{},s=stOf(o.id);return `<div class="oc wide"><div class="oh"><b>${esc(o.id)} · ${inr(o.total)}</b><span class="pill ${s.replace(/ /g,'')}">${s}</span></div><small class="mut">${when(o.ts)}</small><p><b>${esc(d.nm||'Decrypting…')}</b> ${d.ph?`· <a href="tel:${esc(d.ph)}" style="color:inherit">${esc(d.ph)}</a>`:''}<br>${esc(d.ad)}${d.lm?`<br><small class="mut">Near ${esc(d.lm)}</small>`:''}</p><div class="it">${o.items.map(i=>`${esc(i[0])} — ${i[2]} × ${inr(i[1])}`).join('<br>')}<br>Delivery ${o.fee?inr(o.fee):'free'}</div><div class="acts">${NEXT[s]?`<button class="btn" data-set="${NEXT[s]}" data-oid="${o.id}">Mark ${NEXT[s].toLowerCase()}</button>`:''}${act(o)?`<button class="btn bad" data-set="Cancelled" data-oid="${o.id}">Cancel</button>`:''}</div></div>`}).join('')||'<p class="mut">No orders in this view.</p>'}`}
/* ---- shell ---- */
function head(){$('#cn').textContent=Object.values(S.cart).reduce((a,b)=>a+b,0)||'';$('#adm').hidden=!S.admin;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view))}
function render(top){head();$('#main').innerHTML={shop:shopV,cart:cartV,orders:ordersV,acc:accV,admin:adminV}[S.view]();if(top)scrollTo(0,0)}
const soft=()=>document.activeElement?.matches?.('#main input,#main textarea,#main select')?head():render();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset;
if(x.d)return chg(+x.id,+x.d);if(x.cat){S.cat=x.cat;S.page=1;S.view='shop';return render()}if(x.v){S.view=x.v;if(x.v!=='orders')S.flash=null;return render(true)}if(x.f){S.filt=x.f;return render()}
if(x.rm){S.vault.addrs.splice(+x.rm,1);saveVault().then(render);return}
if(x.set){sb.from('orders').update({status:x.set}).eq('id',x.oid).then(()=>refresh()).then(soft);return}
({more:()=>{S.page++;render()},place,vu:unlockVault,vs:vaultSave,vl:()=>{S.vpw=S.vault=null;render()},su:setup,un:unlock,li:()=>authGo(0),sg:()=>authGo(1),so:()=>sb.auth.signOut()})[b.id]?.()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;S.view='shop';render()}else if(/^(nm|ph|ad|lm)$/.test(e.target.id))S.f[e.target.id]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='sa'){const a=S.vault.addrs[e.target.value]||{line:'',lm:''};S.f.ad=a.line;S.f.lm=a.lm||'';render()}});
render();
let sb;
async function refresh(){if(!S.uid)return;const m=await sb.from('orders').select('*').eq('uid',S.uid).order('ts',{ascending:false});S.mine=m.data||[];S.stat={};S.mine.forEach(o=>S.stat[o.id]={st:o.status});
if(S.admin){const a=await sb.from('orders').select('*').order('ts',{ascending:false}).limit(300);S.orders=a.data||[];S.orders.forEach(o=>S.stat[o.id]={st:o.status});decAll()}}
async function onUser(u){S.uid=u?.id||null;S.anon=!!u?.is_anonymous;S.vpw=S.vault=null;S.admin=false;S.mine=[];S.orders=[];
if(u&&!u.is_anonymous){const a=await sb.from('admins').select('uid').eq('uid',u.id).maybeSingle();S.admin=!!a.data}
await refresh();render()}
(async()=>{try{if(!SUPABASE_URL||SUPABASE_URL.includes('YOUR-'))return;sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);S.db=true;
const s=await sb.from('store_public').select('pub').eq('id',1).maybeSingle();S.pub=s.data?.pub||null;S.cfg=true;
const{data}=await sb.auth.getSession();await onUser(data.session?.user);
sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>{if((ses?.user?.id||null)!==S.uid)onUser(ses?.user)},0)});
setInterval(()=>{if(S.uid)refresh().then(soft)},20000)}catch(e){}render()})();
</script></body></html>
